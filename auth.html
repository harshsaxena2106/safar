<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safar - Login & Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* CSS - Safar Minimal Theme */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            background: white;
            width: 400px;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .auth-container h2 {
            color: #007BFF;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .form-group { margin-bottom: 20px; text-align: left; }
        
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #007BFF; }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .auth-btn:hover { background: #0056b3; }

        .toggle-link {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .toggle-link span {
            color: #007BFF;
            cursor: pointer;
            font-weight: 600;
        }

        .message {
            margin-top: 15px;
            font-size: 13px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }
        
        .success { background: #d4edda; color: #155724; display: block; }
        .error { background: #f8d7da; color: #721c24; display: block; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div id="login-form">
            <h2>Login to Safar</h2>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="login-email" placeholder="Enter your email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="Enter password">
            </div>
            <button class="auth-btn" onclick="login()">Login</button>
            <p class="toggle-link">Don't have an account? <span onclick="toggleForm()">Sign Up</span></p>
        </div>

        <div id="signup-form" style="display: none;">
            <h2>Create Account</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="signup-name" placeholder="Your name">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signup-email" placeholder="Email address">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signup-password" placeholder="Create password">
            </div>
            <button class="auth-btn" onclick="signup()">Sign Up</button>
            <p class="toggle-link">Already have an account? <span onclick="toggleForm()">Login</span></p>
        </div>

        <div id="msg" class="message"></div>
    </div>

    <script>
        // JS Logic - Local Database Simulation
        const msgBox = document.getElementById('msg');

        function toggleForm() {
            const loginF = document.getElementById('login-form');
            const signupF = document.getElementById('signup-form');
            msgBox.style.display = 'none';
            
            if(loginF.style.display === "none") {
                loginF.style.display = "block";
                signupF.style.display = "none";
            } else {
                loginF.style.display = "none";
                signupF.style.display = "block";
            }
        }

        // SignUp Function
        function signup() {
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const pass = document.getElementById('signup-password').value;

            if(!name || !email || !pass) {
                showMessage("Please fill all fields!", "error");
                return;
            }

            // Database Save (Local Storage)
            const user = { name, email, pass };
            localStorage.setItem(email, JSON.stringify(user));
            
            showMessage("Registration Successful! Now Login.", "success");
            setTimeout(toggleForm, 1500);
        }

        // Login Function
        function login() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;

            const storedUser = localStorage.getItem(email);
            if(storedUser) {
                const userData = JSON.parse(storedUser);
                if(userData.pass === pass) {
                    localStorage.setItem('currentUser', JSON.stringify(userData)); // करंट यूज़र को सेव करने के लिए
                    showMessage("Welcome back, " + userData.name + "!", "success");
                    // Redirect to main page after login
                    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
                } else {
                    showMessage("Incorrect Password!", "error");
                }
            } else {
                showMessage("User not found!", "error");
            }
        }

        function showMessage(text, type) {
            msgBox.innerText = text;
            msgBox.className = "message " + type;
            msgBox.style.display = "block";
        }
    </script>
</body>
</html>
