<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Safar - All Destinations</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f4f7f6; text-align: center; padding: 50px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        h1 { color: #007BFF; margin-bottom: 20px; }
        .dest-list { text-align: left; margin: 30px 0; }
        .dest-item { padding: 15px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        .back-btn { display: inline-block; padding: 12px 25px; background: #007BFF; color: white; text-decoration: none; border-radius: 5px; font-weight: 600; transition: 0.3s; }
        .back-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Explore All Destinations</h1>
        <div class="dest-list">
            <div class="dest-item"><span>Agra - The City of Taj</span> <strong>₹15,000</strong></div>
            <div class="dest-item"><span>Manali - Snow Adventure</span> <strong>₹12,500</strong></div>
            <div class="dest-item"><span>Kerala - Backwaters</span> <strong>₹18,000</strong></div>
            
            <a href="index.html" class="back-btn">← Back to Home</a>
    </div>
</body>
</html>
